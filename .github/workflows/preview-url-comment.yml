name: Preview URL comment

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  issues: write

concurrency:
  group: shared-preview-url-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  add-preview-url:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == 'cloudflare-workers-and-pages[bot]' &&
       contains(github.event.comment.body, 'No Preview URL.') &&
       contains(github.event.comment.body, '<b>Build:</b> Success') &&
       contains(github.event.comment.body, '<!-- Preview Deployments -->'))
    runs-on: ubuntu-26.04
    steps:
      - name: Add the shared preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          node --input-type=module <<'NODE'
          const [owner, repo] = process.env.REPOSITORY.split("/");
          const issueNumber = Number(process.env.ISSUE_NUMBER);
          const marker = "<!-- miharu-shared-preview-url -->";
          const body = [
            marker,
            "### miharu preview",
            "",
            "[Open the latest shared preview](https://miharu-preview.gtms.workers.dev)",
            "",
            "This is the shared `miharu-preview` Worker. Another pull request may have updated it, so this link does not confirm that this pull request's deployment succeeded.",
          ].join("\n");
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const commentsUrl = `https://api.github.com/repos/${owner}/${repo}/issues/${issueNumber}/comments`;
          let existing;
          let cloudflareReady = false;
          for (let page = 1; ; page += 1) {
            const listResponse = await fetch(
              `${commentsUrl}?per_page=100&page=${page}`,
              { headers },
            );
            if (!listResponse.ok) {
              throw new Error(`Could not list PR comments: ${listResponse.status}`);
            }
            const comments = await listResponse.json();
            existing ||= comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );
            cloudflareReady ||= comments.some(
              (comment) =>
                comment.user?.login === "cloudflare-workers-and-pages[bot]" &&
                comment.body?.includes("No Preview URL.") &&
                comment.body?.includes("<b>Build:</b> Success") &&
                comment.body?.includes("<!-- Preview Deployments -->"),
            );
            if (comments.length < 100) break;
          }
          if (!cloudflareReady) {
            console.log("No successful Cloudflare build comment yet; skipping.");
            process.exit(0);
          }
          const url = existing
            ? `https://api.github.com/repos/${owner}/${repo}/issues/comments/${existing.id}`
            : commentsUrl;
          const response = await fetch(url, {
            method: existing ? "PATCH" : "POST",
            headers: { ...headers, "Content-Type": "application/json" },
            body: JSON.stringify({ body }),
          });
          if (!response.ok) {
            throw new Error(`Could not publish preview URL: ${response.status}`);
          }
          NODE

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: &ubuntu-runner ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - &install-dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test
    runs-on: *ubuntu-runner
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *checkout
      - *setup-mise
      - *install-dependencies
      - run: pnpm test
      - uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          file-coverage-mode: all
          sort-by: statements-asc

  e2e:
    name: E2E
    runs-on: *ubuntu-runner
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-mise
      - *install-dependencies
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

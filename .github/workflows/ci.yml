name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: &ubuntu-runner ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - &install-dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test
    runs-on: *ubuntu-runner
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *checkout
      - *setup-mise
      - *install-dependencies
      - run: pnpm test
      - uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          file-coverage-mode: all
          sort-by: statements-asc

  e2e:
    name: E2E
    runs-on: *ubuntu-runner
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-mise
      - *install-dependencies
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
